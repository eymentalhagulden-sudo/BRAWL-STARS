<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Destek & Elmas Paneli</title>
    <style>
        body {
            background-color: #f0f2f5;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Reklam Alanları */
        .ad-banner {
            position: absolute;
            background: #ffeb3b;
            border: 2px solid #f44336;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            z-index: 1000;
            cursor: pointer;
            animation: flash 0.5s infinite;
        }
        
        .ad-top { top: 0; left: 0; width: 100%; height: 60px; }
        .ad-left { top: 60px; left: 0; width: 120px; height: calc(100% - 60px); }
        .ad-right { top: 60px; right: 0; width: 120px; height: calc(100% - 60px); }
        
        @keyframes flash {
            0% { background: #ffeb3b; color: black; }
            50% { background: #f44336; color: white; }
            100% { background: #ffeb3b; color: black; }
        }

        .main-panel {
            flex: 3;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 60px 120px 0 120px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border-top: 8px solid #007bff;
            position: relative;
        }

        .support-panel {
            flex: 1;
            background: #1c1e21;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-left: 4px solid #007bff;
            margin-top: 60px;
        }

        #console-output {
            flex-grow: 1;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            overflow-y: auto;
            margin-bottom: 10px;
            color: #bdc3c7;
        }

        input, select, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .progress-bar {
            width: 100%;
            background-color: #eee;
            border-radius: 10px;
            display: none;
            margin-top: 20px;
        }

        .progress {
            width: 0%;
            height: 15px;
            background-color: #28a745;
            border-radius: 10px;
            transition: width 0.2s;
        }

        .shake { animation: shake 0.2s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(1px, 1px); }
        }

        .login-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px dashed #ff0000;
            border-radius: 10px;
        }
    </style>
</head>
<body id="main-body">

    <!-- Gizli Ses Dosyası -->
    <audio id="troll-audio" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Never+Gonna+Give+You+Up+Original&filename=mt/mtY5NjM0MTU0OTY1Mzgx_y_2bj_2fVqU1_2bkMc.mp3" type="audio/mpeg">
    </audio>

    <div class="ad-banner ad-top" onclick="alert('KAZANDINIZ!')">🔥🔥 BEDAVA ELMAS İÇİN BURAYA TIKLA! 🔥🔥</div>
    <div class="ad-banner ad-left">🛡️ VİRÜS TEMİZLE <br><br> TIKLA</div>
    <div class="ad-banner ad-right">💰 100.000 TL <br><br> ÇEK</div>

    <div class="main-panel">
        <div class="container" id="main-card">
            <h1 style="color: #007bff;">💎 Elmas Merkezi</h1>
            <p>Resmi 2026 Destek Paneline Hoş Geldiniz.</p>
            
            <input type="text" id="username" placeholder="Supercell ID Giriniz">
            <select id="gem-amount">
                <option value="170">170 Elmas Paketi</option>
                <option value="950">950 Elmas Paketi</option>
                <option value="2000">2000 Elmas Paketi</option>
            </select>
            <button onclick="startHack()">GÖNDERİMİ BAŞLAT</button>

            <div id="loader" class="progress-bar">
                <p id="status" style="font-size: 14px; margin-bottom: 5px;">Bağlanılıyor...</p>
                <div class="progress-bar" style="display: block;">
                    <div id="myProgress" class="progress"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="support-panel">
        <div class="support-header">DURUM KONSOLU v2.0</div>
        <div id="console-output">
            > Sistem hazır...<br>
            > Destek ekibi aktif.<br>
            > Komut bekliyor...
        </div>
        <input type="text" id="console-input" style="background:#2c2f33; color:white; border:none; padding:10px; width:80%;" placeholder="Komut yaz..." onkeydown="if(event.key==='Enter') executeCommand()">
    </div>

    <script>
        let width = 0;
        let isHacked = false;

        function startHack() {
            let user = document.getElementById("username").value;
            if(!user) return alert("Kullanıcı adı boş!");

            // Müzik çalmaya başlar (Buton etkileşimi olduğu için tarayıcı izin verir)
            let audio = document.getElementById("troll-audio");
            audio.play();

            document.getElementById("loader").style.display = "block";
            let elem = document.getElementById("myProgress");
            let status = document.getElementById("status");
            
            let id = setInterval(() => {
                if (width >= 100) {
                    clearInterval(id);
                    triggerTroll();
                } else {
                    if(isHacked && width >= 99) return; 
                    width++;
                    elem.style.width = width + '%';
                    if(width == 30) status.innerHTML = "Veritabanı taranıyor...";
                    if(width == 70) status.innerHTML = "Güvenlik duvarı aşılıyor...";
                }
            }, 80);
        }

        function triggerTroll() {
            const mainCard = document.getElementById("main-card");
            mainCard.innerHTML = `<h1 style="color:red; font-size: 35px;">⚠️ SİSTEM İSTİLA EDİLDİ!</h1>
                                  <p>Tüm elmaslarınız ele geçirildi...</p>`;
            
            setTimeout(() => {
                mainCard.innerHTML = `
                    <h2 style="color:red;">ŞAKALANDIN!</h2>
                    <iframe width="100%" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0" 
                            title="Rickroll" frameborder="0" allow="autoplay; encrypted-media">
                    </iframe>
                    <div class="login-box">
                        <p style="font-weight:bold;">Hesabı Kurtarmak İçin:</p>
                        <input type="text" placeholder="İsim">
                        <input type="password" placeholder="Şifre">
                        <button style="background: #28a745;">KURTAR</button>
                    </div>
                `;
                document.getElementById("main-body").classList.add("shake");
            }, 2000);
        }

        function executeCommand() {
            let cmdInput = document.getElementById("console-input");
            let output = document.getElementById("console-output");
            let cmd = cmdInput.value.toLowerCase();
            cmdInput.value = "";

            if(cmd === "hack") {
                isHacked = true;
                output.innerHTML += `<br><span style="color:yellow">> Zorlamalı sızma aktif!</span>`;
                width = 98;
            } 
            else if(cmd === "clear") {
                output.innerHTML = "> Konsol temizlendi.";
            }
            else {
                output.innerHTML += `<br>> Komut algılanamadı: ${cmd}`;
            }
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
