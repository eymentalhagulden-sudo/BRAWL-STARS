<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL_CORE_2126_ULTRA</title>
    <style>
        :root {
            --neon-cyan: #00ffff;
            --hacker-red: #ff0033;
            --deep-space: #010103;
        }

        body {
            background-color: var(--deep-space);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1500px;
        }

        /* Arka Plan Parçacıkları */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0a0a1a 0%, #010103 100%);
        }

        /* 100 Yıl Sonrası Kristal Panel */
        .crystal-panel {
            width: 380px;
            padding: 50px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, opacity 0.5s;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.05);
        }

        h1 {
            font-weight: 100;
            letter-spacing: 12px;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px var(--neon-cyan);
            margin-bottom: 30px;
            transform: translateZ(60px);
        }

        .input-ui {
            transform: translateZ(40px);
            margin: 20px 0;
        }

        input, select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.2);
            color: white;
            width: 100%;
            padding: 12px;
            text-align: center;
            font-family: inherit;
            outline: none;
            cursor: crosshair;
        }

        button {
            margin-top: 30px;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 11px;
            transform: translateZ(50px);
            transition: 0.3s;
        }

        button:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        /* Hacklenmiş Siyah Glitch Ekranı */
        #hacker-void {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5000;
        }

        .glitch-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUicKgR6S7Lqz/giphy.gif');
            opacity: 0.3;
            pointer-events: none;
        }

        #error-msg {
            color: var(--hacker-red);
            font-family: monospace;
            font-size: 18px;
            text-shadow: 0 0 10px var(--hacker-red);
            z-index: 5001;
            margin-bottom: 20px;
        }

        .shake { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } 100% { transform: translate(2px, 2px); } }

    </style>
</head>
<body>

    <div id="bg-canvas"></div>

    <div class="crystal-panel" id="main-panel">
        <div style="font-size: 9px; opacity: 0.3; letter-spacing: 3px; margin-bottom: 10px;">CORE_CONNECTION_v99.0</div>
        <h1>GEN_GEMS</h1>
        
        <div class="input-ui">
            <input type="text" id="user-id" placeholder="NEURAL_CONSCIOUSNESS_ID">
        </div>
        
        <div class="input-ui">
            <p style="font-size: 8px; opacity: 0.5; margin-bottom: 5px;">ELMAS MİKTARI SEÇİN</p>
            <select id="gem-select">
                <option value="1">170 QUANTUM GEMS</option>
                <option value="2">2500 MEGA UNITS</option>
                <option value="3">INF_CORE_ELMAS</option>
            </select>
        </div>

        <button onclick="triggerHack()">MANIFEST_GEMS</button>
    </div>

    <!-- Siyah Glitchli Hack Ekranı -->
    <div id="hacker-void">
        <div class="glitch-overlay"></div>
        <div id="error-msg">> CRITICAL_ERROR: SYSTEM_INJECTION_DETECTED<br>> DATA_LEAK_STARTED...</div>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" frameborder="0" allow="autoplay" style="z-index: 5002;"></iframe>
        <p style="color: gray; font-size: 10px; margin-top: 20px;">ACCESSING_LOCAL_FILES... %84</p>
    </div>

    <audio id="troll-audio" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Never+Gonna+Give+You+Up+Original&filename=mt/mtY5NjM0MTU0OTY1Mzgx_y_2bj_2fVqU1_2bkMc.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 3D Hareket
        document.addEventListener('mousemove', (e) => {
            const panel = document.getElementById('main-panel');
            const x = (window.innerWidth / 2 - e.pageX) / 25;
            const y = (window.innerHeight / 2 - e.pageY) / 25;
            panel.style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        function triggerHack() {
            if(!document.getElementById('user-id').value) return alert("ID GEREKLİ.");

            document.getElementById("troll-audio").play();
            const panel = document.getElementById('main-panel');
            
            // Bozulma efekti
            panel.style.opacity = "0";
            document.body.classList.add("shake");
            
            setTimeout(() => {
                document.getElementById('hacker-void').style.display = 'flex';
                document.body.classList.remove("shake");
            }, 1000);
        }
    </script>
</body>
</html>
