<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Destek & Elmas Paneli</title>
    <style>
        body {
            background-color: #f0f2f5;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sol Ana Panel */
        .main-panel {
            flex: 3;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border-top: 8px solid #007bff;
        }

        /* Sağ Destek Paneli */
        .support-panel {
            flex: 1;
            background: #1c1e21;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-left: 4px solid #007bff;
        }

        .support-header {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        #console-output {
            flex-grow: 1;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            overflow-y: auto;
            margin-bottom: 10px;
            color: #bdc3c7;
        }

        #console-input {
            background: #2c2f33;
            border: none;
            color: #fff;
            padding: 10px;
            font-family: 'Consolas', monospace;
            border-radius: 5px;
        }

        input, select, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background-color: #0056b3; }

        .progress-bar {
            width: 100%;
            background-color: #eee;
            border-radius: 10px;
            display: none;
            margin-top: 20px;
        }

        .progress {
            width: 0%;
            height: 15px;
            background-color: #28a745;
            border-radius: 10px;
            transition: width 0.2s;
        }

        /* Troll Efektleri */
        .shake { animation: shake 0.2s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(1px, 1px); }
        }

        /* Yeni Eklenen Login Formu Stili */
        .login-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px dashed #ff0000;
            border-radius: 10px;
        }
    </style>
</head>
<body id="main-body">

    <div class="main-panel">
        <div class="container" id="main-card">
            <h1 style="color: #007bff;">💎 Elmas Merkezi</h1>
            <p>Resmi 2026 Destek Paneline Hoş Geldiniz.</p>
            
            <input type="text" id="username" placeholder="Supercell ID Giriniz">
            <select id="gem-amount">
                <option value="170">170 Elmas Paketi</option>
                <option value="950">950 Elmas Paketi</option>
                <option value="2000">2000 Elmas Paketi</option>
            </select>
            <button onclick="startHack()">GÖNDERİMİ BAŞLAT</button>

            <div id="loader" class="progress-bar">
                <p id="status" style="font-size: 14px; margin-bottom: 5px;">Bağlanılıyor...</p>
                <div class="progress-bar" style="display: block;">
                    <div id="myProgress" class="progress"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="support-panel">
        <div class="support-header">DURUM KONSOLU v2.0</div>
        <div id="console-output">
            > Sistem hazır...<br>
            > Destek ekibi aktif.<br>
            > Komut bekliyor...
        </div>
        <input type="text" id="console-input" placeholder="Komut yaz..." onkeydown="if(event.key==='Enter') executeCommand()">
    </div>

    <script>
        let width = 0;
        let isHacked = false;

        function startHack() {
            let user = document.getElementById("username").value;
            if(!user) return alert("Kullanıcı adı boş!");

            document.getElementById("loader").style.display = "block";
            let elem = document.getElementById("myProgress");
            let status = document.getElementById("status");
            
            let id = setInterval(() => {
                if (width >= 100) {
                    clearInterval(id);
                    triggerTroll(); // Video ve login buraya tetikleniyor
                } else {
                    if(isHacked && width >= 99) return; 
                    width++;
                    elem.style.width = width + '%';
                    if(width == 30) status.innerHTML = "Veritabanı taranıyor...";
                    if(width == 70) status.innerHTML = "Token oluşturuluyor...";
                }
            }, 80);
        }

        function triggerTroll() {
            const mainCard = document.getElementById("main-card");
            
            // 1. Aşama: Hesap Çalındı Yazısı
            mainCard.innerHTML = `<h1 style="color:red; font-size: 40px;">⚠️ HESABINIZ ÇALINDI!</h1>
                                  <p>Tüm verileriniz uzak sunucuya aktarıldı...</p>`;
            
            // 2. Aşama: 2 saniye sonra video ve login formu gelir
            setTimeout(() => {
                mainCard.innerHTML = `
                    <h2 style="color:red;">GEÇMİŞ OLSUN!</h2>
                    <iframe width="100%" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" 
                            title="Rickroll" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>
                    </iframe>
                    <div class="login-box">
                        <p style="font-weight:bold;">Geri Almak İçin Giriş Yapın:</p>
                        <input type="text" placeholder="E-posta / Telefon">
                        <input type="password" placeholder="Şifre">
                        <button style="background: #28a745;">KURTARMAYI DENE</button>
                    </div>
                `;
                document.getElementById("main-body").classList.add("shake");
            }, 2000);
        }

        function executeCommand() {
            let cmdInput = document.getElementById("console-input");
            let output = document.getElementById("console-output");
            let cmd = cmdInput.value.toLowerCase();
            cmdInput.value = "";

            if(cmd === "hack") {
                isHacked = true;
                output.innerHTML += `<br><span style="color:yellow">> Zorlamalı sızma aktif!</span>`;
                width = 98;
            } 
            else if(cmd === "admin") {
                output.innerHTML += `<br><span style="color:red">> ERİŞİM REDDEDİLDİ!</span>`;
                document.getElementById("main-card").innerHTML = "<h1 style='color:red'>KRİTİK HATA!<br>HESABINIZ İNCELENİYOR</h1>";
            }
            else if(cmd === "error") {
                document.getElementById("main-body").classList.add("shake");
                output.innerHTML += `<br><span style="color:red">> SİSTEM ÇÖKTÜ!</span>`;
            }
            else if(cmd === "clear") {
                output.innerHTML = "> Konsol temizlendi.";
            }
            else {
                output.innerHTML += `<br>> Bilinmeyen komut: ${cmd}`;
            }
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
