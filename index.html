<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAWL_CORE_2126</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --hacker-red: #ff003c;
            --bg-dark: #020205;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            perspective: 2000px;
        }

        /* Arka Plan Enerji Parçacıkları */
        #stars {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a20 0%, #020205 100%);
            z-index: -1;
        }

        /* 3D Hologram Panel */
        .holo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg);
            width: 400px;
            padding: 60px;
            background: rgba(0, 243, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(20px);
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 10px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px var(--neon-blue);
            transform: translateZ(80px);
        }

        .input-box {
            transform: translateZ(50px);
            margin-bottom: 25px;
        }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 15px;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            outline: none;
            text-transform: uppercase;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 20px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 5px;
            transition: 0.3s;
            transform: translateZ(60px);
        }

        button:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 40px var(--neon-blue);
        }

        /* Hack Siyah Ekranı */
        #hack-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .glitch-effect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUicKgR6S7Lqz/giphy.gif');
            opacity: 0.2;
            pointer-events: none;
        }

        .hack-text {
            color: var(--hacker-red);
            font-size: 50px;
            font-weight: 900;
            text-shadow: 0 0 20px var(--hacker-red);
            margin-bottom: 20px;
            z-index: 10001;
            animation: blink 0.1s infinite;
        }

        @keyframes blink { 
            0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } 
        }

        .shake { animation: shakeEffect 0.1s infinite; }
        @keyframes shakeEffect {
            0% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -3px); }
        }
    </style>
</head>
<body>

    <div id="stars"></div>

    <div class="holo-container" id="panel">
        <div style="font-size: 10px; opacity: 0.5; margin-bottom: 20px;">ACCESSING_GEN_5_CORE...</div>
        <h1>GEMS_2126</h1>
        
        <div class="input-box">
            <input type="text" id="id" placeholder="USER_CONSCIOUSNESS_ID">
        </div>

        <div class="input-box">
            <select id="amount">
                <option>170 QUANTUM GEMS</option>
                <option>2500 NEURAL GEMS</option>
                <option>INF_GEMS (SINGULARITY)</option>
            </select>
        </div>

        <button onclick="startHack()">ACTIVATE_MANIFEST</button>
    </div>

    <!-- Final Hack Ekranı -->
    <div id="hack-overlay">
        <div class="glitch-effect"></div>
        <div class="hack-text">HACKLENDİN!</div>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" frameborder="0" allow="autoplay"></iframe>
        <p style="color: gray; margin-top: 20px; font-size: 12px;">SYSTEM_BREACH: 100% | DATA_LEAK: ACTIVE</p>
    </div>

    <audio id="rick-audio" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Never+Gonna+Give+You+Up+Original&filename=mt/mtY5NjM0MTU0OTY1Mzgx_y_2bj_2fVqU1_2bkMc.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 3D Hareket Sistemi
        document.addEventListener('mousemove', (e) => {
            const panel = document.getElementById('panel');
            const x = (window.innerWidth / 2 - e.pageX) / 20;
            const y = (window.innerHeight / 2 - e.pageY) / 20;
            panel.style.transform = `translate(-50%, -50%) rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        function startHack() {
            if(!document.getElementById('id').value) return alert("ID GEREKLİ!");

            document.getElementById('rick-audio').play();
            document.body.classList.add('shake');
            
            setTimeout(() => {
                document.getElementById('panel').style.display = 'none';
                document.getElementById('hack-overlay').style.display = 'flex';
                document.body.classList.remove('shake');
            }, 1000);
        }
    </script>
</body>
</html>
