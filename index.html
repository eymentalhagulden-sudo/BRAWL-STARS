<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL_CORE_2126</title>
    <style>
        :root {
            --core-white: rgba(255, 255, 255, 0.8);
            --neon-cyan: #00ffff;
            --deep-space: #020205;
        }

        body {
            background-color: var(--deep-space);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 2000px;
        }

        /* Kuantum Parçacık Arka Planı */
        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a1a2e 0%, #020205 100%);
        }

        /* 3D Kristal Kart */
        .crystal-panel {
            width: 400px;
            padding: 60px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 2px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.05);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        h1 {
            font-weight: 200;
            letter-spacing: 15px;
            text-transform: uppercase;
            font-size: 24px;
            margin-bottom: 40px;
            transform: translateZ(50px);
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        .input-group {
            transform: translateZ(30px);
            margin-bottom: 20px;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 100%;
            padding: 10px;
            text-align: center;
            font-family: inherit;
            letter-spacing: 3px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-bottom: 1px solid var(--neon-cyan); }

        button {
            margin-top: 40px;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px 40px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 10px;
            transition: 0.4s;
            transform: translateZ(40px);
        }

        button:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        /* Sistem Yükleniyor Işığı */
        #light-beam {
            position: fixed;
            width: 2px;
            height: 0;
            background: var(--neon-cyan);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 100px var(--neon-cyan);
            transition: height 2s, width 1s;
            z-index: 1000;
        }

        /* Final Beyaz Ekran */
        #final-void {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <div id="particles"></div>
    <div id="light-beam"></div>

    <div class="crystal-panel" id="main-panel">
        <div style="font-size: 8px; margin-bottom: 20px; opacity: 0.4; letter-spacing: 2px;">NEURAL_LINK_ESTABLISHED</div>
        <h1>Gems_2126</h1>
        
        <div class="input-group">
            <input type="text" id="target" placeholder="USER_CONSCIOUSNESS_ID">
        </div>
        
        <div class="input-group">
            <p style="font-size: 9px; opacity: 0.5;">SELECT QUANTUM UNIT</p>
            <input type="number" placeholder="∞" disabled>
        </div>

        <button onclick="startAscension()">Manifest_Gems</button>
    </div>

    <div id="final-void">
        <h2 style="color: black; letter-spacing: 10px; font-weight: 200; margin-bottom: 30px;">HACK_SUCCESSFUL</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" frameborder="0" allow="autoplay"></iframe>
    </div>

    <audio id="troll-audio" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Never+Gonna+Give+You+Up+Original&filename=mt/mtY5NjM0MTU0OTY1Mzgx_y_2bj_2fVqU1_2bkMc.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 3D Hareket Efekti
        document.addEventListener('mousemove', (e) => {
            const panel = document.getElementById('main-panel');
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            panel.style.transform = `rotateX(${y}deg) rotateY(${-x}deg)`;
        });

        function startAscension() {
            if(!document.getElementById('target').value) return alert("ID?");

            document.getElementById("troll-audio").play();
            const beam = document.getElementById('light-beam');
            const panel = document.getElementById('main-panel');
            
            panel.style.opacity = "0.5";
            panel.style.filter = "blur(10px)";
            
            // Enerji ışığı büyüyor
            beam.style.height = "100vh";
            
            setTimeout(() => {
                beam.style.width = "100vw";
            }, 1500);

            setTimeout(() => {
                document.getElementById('final-void').style.display = 'flex';
            }, 2500);
        }
    </script>
</body>
</html>
