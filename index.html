<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSteal Sunucu Portalı</title>
    <!-- FontAwesome ikonları için -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1a162e;
            --accent-color: #ff3344; /* LifeSteal kırmızısı */
            --text-color: #ffffff;
            --text-muted: #a0aec0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Arka plan efekti */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-color);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            top: 20%;
            left: 30%;
            z-index: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 51, 68, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .server-logo {
            font-size: 4rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        h1 span {
            color: var(--accent-color);
        }

        .tagline {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* IP Kopyalama Alanı */
        .ip-box {
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed rgba(255, 51, 68, 0.3);
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ip-box:hover {
            border-color: var(--accent-color);
            background: rgba(255, 51, 68, 0.05);
        }

        .ip-text {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }

        .ip-icon {
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        /* Butonlar alanı */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.8rem;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
            transition: transform 0.2s, filter 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .btn-discord {
            background-color: #5865F2;
        }

        .btn-youtube {
            background-color: #FF0000;
        }

        /* Bildirim kutusu (Kopyalandı yazısı için) */
        .toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #2e7d32;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 500;
            transition: bottom 0.3s ease;
            z-index: 10;
        }

        .toast.show {
            bottom: 30px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sunucu İkonu (Kalp sembolü LifeSteal'i temsil eder) -->
        <div class="server-logo">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>

        <h1>GHOST<span>LIFESTEAL</span></h1>
        <p class="tagline">Kalplerini koru, rakiplerini yok et!</p>

        <!-- IP Kopyalama Alanı -->
        <div class="ip-box" onclick="copyIP()">
            <span class="ip-text" id="serverIP">play.ghostlifesteal.com</span>
            <span class="ip-icon"><i class="fa-regular fa-copy"></i> Kopyala</span>
        </div>

        <!-- Sosyal Medya Linkleri -->
        <div class="links-container">
            <!-- Discord Linki (href kısmına kendi davet linkini yaz) -->
            <a href="https://discord.gg/davetkodu" target="_blank" class="btn btn-discord">
                <i class="fa-brands fa-discord"></i> Discord Sunucumuza Katıl
            </a>
            
            <!-- YouTube Linki (href kısmına kanal linkini yaz) -->
            <a href="https://youtube.com/kanallinki" target="_blank" class="btn btn-youtube">
                <i class="fa-brands fa-youtube"></i> YouTube Kanalımız
            </a>
        </div>
    </div>

    <!-- Kopyalandı Bildirimi -->
    <div id="toast" class="toast">IP Adresi Başarıyla Kopyalandı!</div>

    <script>
        function copyIP() {
            const ipText = document.getElementById('serverIP').innerText;
            navigator.clipboard.writeText(ipText).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }).catch(err => {
                console.error('Kopyalama başarısız oldu: ', err);
            });
        }
    </script>
</body>
</html>
