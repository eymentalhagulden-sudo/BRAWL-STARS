<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAWL_GEMS_NEURAL_2126</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* 
           NEURAL SYSTEM 2126 - FIX VERSION
        */
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --hacker-red: #ff003c;
            --deep-space: #010108;
            --glass: rgba(0, 255, 255, 0.05);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--deep-space);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        /* Dinamik Arka Plan */
        #canvas-bg {
            position: fixed; top: 0; left: 0; z-index: -1;
            background: radial-gradient(circle at center, #0a1128 0%, #010108 100%);
        }

        /* Sahne ve Perspektif */
        .scene {
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            perspective: 1500px;
        }

        /* Ana Hologram Paneli */
        .hologram-card {
            position: relative;
            width: 420px;
            background: var(--glass);
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            padding: 40px;
            transform-style: preserve-3d;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
            transition: transform 0.1s ease-out;
            z-index: 10;
        }

        /* Köşe Süsleri */
        .corner {
            position: absolute; width: 15px; height: 15px;
            border: 2px solid var(--neon-cyan);
        }
        .top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        h1 {
            text-align: center; font-weight: 900; letter-spacing: 5px;
            font-size: 24px; margin-bottom: 40px;
            text-shadow: 0 0 15px var(--neon-cyan);
            transform: translateZ(30px);
        }

        .input-group {
            margin-bottom: 25px;
            transform: translateZ(20px);
            position: relative;
            z-index: 20; /* Tıklanabilir olması için önemli */
        }

        label {
            display: block; font-size: 10px; margin-bottom: 8px;
            letter-spacing: 2px; opacity: 0.8;
        }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 15px;
            color: white;
            font-family: 'Share Tech Mono', monospace;
            outline: none;
            transition: 0.3s;
            cursor: text;
        }

        input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        select { cursor: pointer; }

        button {
            width: 100%;
            padding: 20px;
            margin-top: 20px;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.4s;
            transform: translateZ(40px);
        }

        button:hover {
            background: var(--neon-cyan);
            color: black;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        /* Sistem Logları */
        #logs {
            position: fixed; bottom: 20px; left: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px; color: rgba(0, 255, 255, 0.4);
            pointer-events: none;
        }

        /* HACK EKRANI (SİYAH & GLITCH) */
        #hack-void {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .glitch-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUicKgR6S7Lqz/giphy.gif');
            opacity: 0.15; pointer-events: none;
        }

        .hacked-text {
            color: var(--hacker-red);
            font-size: 60px; font-weight: 900;
            text-shadow: 0 0 20px red;
            margin-bottom: 20px;
            animation: blink 0.1s infinite;
            z-index: 10001;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

        iframe {
            border: 2px solid var(--hacker-red);
            z-index: 10002;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
        }

        .shake { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } }

    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>
    <div id="logs"></div>

    <div class="scene">
        <div class="hologram-card" id="card">
            <div class="corner top-left"></div>
            <div class="corner bottom-right"></div>
            
            <p style="font-size: 8px; opacity: 0.4; letter-spacing: 2px;">NEURAL_STARS_v2126</p>
            <h1>BRAWL GEMS</h1>

            <div class="input-group">
                <label>OYUNCU_ID (NÖRAL ETİKET)</label>
                <input type="text" id="player-id" placeholder="Örn: #GY82KL9">
            </div>

            <div class="input-group">
                <label>ELMAS MİKTARI</label>
                <select id="gem-qty">
                    <option>170 ELMAS (GÜVENLİ)</option>
                    <option>2500 ELMAS (RİSKLİ)</option>
                    <option>99999 ELMAS (SINIRSIZ)</option>
                </select>
            </div>

            <button onclick="initiateHack()">ELMASLARI AL</button>
            
            <p style="font-size: 7px; margin-top: 30px; opacity: 0.3; text-align: center;">
                SİSTEM DURUMU: <span style="color: lime;">AKTİF</span><br>
                100 YIL SONRAKİ TEKNOLOJİYLE ÜRETİLMİŞTİR
            </p>
        </div>
    </div>

    <!-- Hack Paneli -->
    <div id="hack-void">
        <div class="glitch-bg"></div>
        <div class="hacked-text">HACKLENDİN!</div>
        <iframe id="rick-video" width="560" height="315" src="" frameborder="0" allow="autoplay"></iframe>
        <p style="color: #444; margin-top: 20px; font-family: monospace;">VERİLERİNİZ BULUTA AKTARILIYOR... %99</p>
    </div>

    <audio id="rick-sound" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Never+Gonna+Give+You+Up+Original&filename=mt/mtY5NjM0MTU0OTY1Mzgx_y_2bj_2fVqU1_2bkMc.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. ARKA PLAN ÇİZİMİ
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let dots = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            for(let i=0; i<100; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(0, 255, 255, 0.3)";
            dots.forEach(d => {
                d.x += d.speedX;
                d.y += d.speedY;
                if(d.x < 0 || d.x > canvas.width) d.speedX *= -1;
                if(d.y < 0 || d.y > canvas.height) d.speedY *= -1;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.size, 0, Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        // 2. 3D HAREKET (Yazma Engelini Kaldırmak İçin Yumuşatıldı)
        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            let x = (window.innerWidth / 2 - e.clientX) / 40; // Hassasiyet azaltıldı
            let y = (window.innerHeight / 2 - e.clientY) / 40;
            card.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
        });

        // 3. LOG SİSTEMİ
        const logBox = document.getElementById('logs');
        function addLog() {
            const msgs = ["> SİSTEME SIZILIYOR...", "> VERİTABANI BULUNDU", "> ŞİFRELER ÇÖZÜLÜYOR...", "> GÜVENLİK DUVARI BYPASS EDİLDİ"];
            let p = document.createElement('div');
            p.innerText = msgs[Math.floor(Math.random()*msgs.length)];
            logBox.appendChild(p);
            if(logBox.childNodes.length > 5) logBox.removeChild(logBox.firstChild);
        }
        setInterval(addLog, 3000);

        // 4. HACK TETİKLEME
        function initiateHack() {
            let id = document.getElementById('player-id').value;
            if(!id) return alert("OYUNCU ID GİRMELİSİN!");

            document.getElementById('rick-sound').play();
            document.body.classList.add('shake');
            
            setTimeout(() => {
                document.getElementById('hack-void').style.display = 'flex';
                document.getElementById('rick-video').src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
                document.body.classList.remove('shake');
            }, 1200);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
