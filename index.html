<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Destek & Elmas Paneli</title>
    <style>
        body {
            background-color: #f0f2f5;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: transform 2s ease-in-out;
        }

        /* Reklam ve Bildirim Alanları */
        .ad-banner {
            position: absolute;
            background: #ffeb3b;
            border: 2px solid #f44336;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            z-index: 1000;
            animation: flash 0.5s infinite;
        }
        .ad-top { top: 0; left: 0; width: 100%; height: 50px; }
        
        .notification {
            position: fixed;
            right: 20px;
            background: white;
            border-left: 5px solid #28a745;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 2000;
            border-radius: 5px;
            display: none;
        }

        /* Geri Sayım Sayacı */
        #countdown-timer {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: red;
            color: white;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 0 0 10px 10px;
            z-index: 3000;
        }

        /* Fareyi Takip Eden Elmas */
        #follower {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            z-index: 9999;
        }

        .main-panel {
            flex: 3;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border-top: 8px solid #007bff;
        }

        .support-panel {
            flex: 1;
            background: #1c1e21;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-left: 4px solid #007bff;
        }

        @keyframes flash {
            0%, 100% { background: #ffeb3b; }
            50% { background: #f44336; color: white; }
        }

        .shake { animation: shake 0.2s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(1px, 1px); }
        }
    </style>
</head>
<body id="main-body">

    <div id="follower">💎</div>
    <div id="countdown-timer">HESAP SİLİNMESİNE SON: 60:00</div>
    
    <div id="notif" class="notification" style="bottom: 20px;">
        <strong>SİSTEM MESAJI:</strong> <br> Bir kullanıcı 2000 elmas aldı!
    </div>

    <audio id="troll-audio" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Never+Gonna+Give+You+Up+Original&filename=mt/mtY5NjM0MTU0OTY1Mzgx_y_2bj_2fVqU1_2bkMc.mp3" type="audio/mpeg">
    </audio>

    <div class="ad-banner ad-top">⚠️ UYARI: CİHAZINIZDA 13 ADET VİRÜS BULUNDU! ⚠️</div>

    <div class="main-panel">
        <div class="container" id="main-card">
            <h1 style="color: #007bff;">💎 Elmas Merkezi</h1>
            <p>Supercell ID'nizi girerek elmas yüklemesini başlatın.</p>
            
            <input type="text" id="username" placeholder="Supercell ID Giriniz">
            <select id="gem-amount">
                <option value="170">170 Elmas Paketi</option>
                <option value="950">950 Elmas Paketi</option>
                <option value="2000">2000 Elmas Paketi</option>
            </select>
            <button onclick="startHack()">GÖNDERİMİ BAŞLAT</button>

            <div id="loader" style="display:none; margin-top:20px;">
                <p id="status">Bağlanılıyor...</p>
                <div style="background:#eee; height:15px; border-radius:10px;">
                    <div id="myProgress" style="width:0%; height:100%; background:#28a745; border-radius:10px; transition:0.1s;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="support-panel">
        <div class="support-header" style="color:#007bff; font-weight:bold;">KONSOL v3.0</div>
        <div id="console-output" style="font-family:monospace; font-size:12px; color:#ccc; overflow-y:auto; flex-grow:1;">
            > Sistem hazır...
        </div>
    </div>

    <script>
        let width = 0;
        let timeLeft = 3600;

        // 1. Fare Takipçisi
        const follower = document.getElementById('follower');
        document.addEventListener('mousemove', (e) => {
            follower.style.left = e.pageX + 10 + 'px';
            follower.style.top = e.pageY + 10 + 'px';
        });

        // 2. Geri Sayım
        setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('countdown-timer').innerHTML = `HESAP SİLİNMESİNE SON: ${mins}:${secs < 10 ? '0'+secs : secs}`;
        }, 1000);

        // 3. Rastgele Bildirimler
        setInterval(() => {
            const notif = document.getElementById('notif');
            notif.style.display = 'block';
            setTimeout(() => notif.style.display = 'none', 3000);
        }, 8000);

        function startHack() {
            if(!document.getElementById("username").value) return alert("ID Girin!");
            
            document.getElementById("troll-audio").play();
            document.getElementById("loader").style.display = "block";
            
            let id = setInterval(() => {
                if (width >= 100) {
                    clearInterval(id);
                    triggerTroll();
                } else {
                    width++;
                    document.getElementById("myProgress").style.width = width + '%';
                    if(width == 50) {
                        // 4. Ekranı Ters Döndür
                        document.body.style.transform = "rotate(180deg)";
                        document.getElementById("status").innerHTML = "HATA: YERÇEKİMİ KAYBOLUYOR!";
                    }
                }
            }, 60);
        }

        function triggerTroll() {
            const card = document.getElementById("main-card");
            card.innerHTML = `<h1 style="color:red;">HESAP ELE GEÇİRİLDİ!</h1>`;
            document.getElementById("main-body").classList.add("shake");
            
            setTimeout(() => {
                card.innerHTML = `
                    <iframe width="100%" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" frameborder="0" allow="autoplay"></iframe>
                    <div style="border:2px dashed red; margin-top:10px; padding:10px;">
                        <p>Kurtarmak için şifreni yaz:</p>
                        <input type="password" placeholder="Eski Şifren">
                        <button style="background:green;">HESABI GERİ AL</button>
                    </div>
                `;
            }, 2000);
        }
    </script>
</body>
</html>
