<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars Ücretsiz Elmas Hilesi 2026</title>
    <style>
        body {
            background-color: #1a2a6c;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 20px;
            border: 5px solid #f1c40f;
            display: inline-block;
        }
        input, select {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            width: 80%;
        }
        button {
            padding: 15px 30px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
        }
        #loader {
            display: none;
            margin-top: 20px;
        }
        .progress-bar {
            width: 100%;
            background-color: #ddd;
            border-radius: 10px;
        }
        .progress {
            width: 0%;
            height: 20px;
            background-color: #27ae60;
            border-radius: 10px;
            transition: width 0.5s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>💎 ELMAS JENERATÖRÜ 💎</h1>
        <p>Kullanıcı adını gir ve elmasları hesabına aktar!</p>
        
        <input type="text" id="username" placeholder="Oyuncu Adı (Örn: ProPlayer#123)">
        <br>
        <select id="gem-amount">
            <option value="170">170 Elmas</option>
            <option value="360">360 Elmas</option>
            <option value="950">950 Elmas</option>
            <option value="2000">2000 Elmas</option>
        </select>
        <br>
        <button onclick="startHack()">ELMASLARI GÖNDER</button>

        <div id="loader">
            <p id="status">Sunucuya bağlanılıyor...</p>
            <div class="progress-bar">
                <div id="myProgress" class="progress"></div>
            </div>
        </div>
    </div>

    <script>
        function startHack() {
            let user = document.getElementById("username").value;
            if(user === "") {
                alert("Lütfen önce kullanıcı adını gir!");
                return;
            }

            document.getElementById("loader").style.display = "block";
            let elem = document.getElementById("myProgress");
            let status = document.getElementById("status");
            let width = 0;
            
            let id = setInterval(frame, 50); // Hız ayarı
            
            function frame() {
                if (width >= 100) {
                    clearInterval(id);
                    status.innerHTML = "ELMASLAR AKTARILIYOR... SON ADIM!";
                    setTimeout(() => {
                        // BURASI ŞAKA KISMI: Rickroll'a yönlendiriyor
                        window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
                    }, 1500);
                } else {
                    width++;
                    elem.style.width = width + '%';
                    if(width == 30) status.innerHTML = "Kullanıcı verileri çekiliyor...";
                    if(width == 60) status.innerHTML = "Hata ayıklanıyor (Anti-Ban Aktif)...";
                    if(width == 85) status.innerHTML = "Supercell sunucularına sızılıyor...";
                }
            }
        }
    </script>
</body>
</html>
