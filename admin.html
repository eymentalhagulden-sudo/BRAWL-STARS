<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaceNetwork - Başvuru Takip Paneli</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 30px; }
        h2 { color: #00adb5; border-bottom: 2px solid #222; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border: 1px solid #2a2a2a; padding: 20px; border-radius: 8px; border-top: 4px solid #00adb5; position: relative; }
        .card p { margin: 10px 0; font-size: 14px; color: #ccc; }
        .card b { color: #00adb5; }
        .date { font-size: 12px; color: #666; position: absolute; top: 15px; right: 20px; }
        .btn-delete { background: #ff4757; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 15px; float: right; }
        #loading { text-align: center; font-size: 18px; color: #888; }
    </style>
</head>
<body>

    <h2>Gelen Yetkili Başvuruları</h2>
    <div id="loading">Veri tabanına bağlanılıyor ve başvurular çekiliyor...</div>
    <div class="grid" id="appsContainer"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Senin bana yolladığın EN GÜNCEL yeni kodlar:
    const firebaseConfig = {
        apiKey: "AIzaSyDCdKrL0esnV6mTr3EpySxtHr7nN1I7zhY",
        authDomain: "planning-with-ai-fc541.firebaseapp.com",
        projectId: "planning-with-ai-fc541",
        storageBucket: "planning-with-ai-fc541.firebasestorage.app",
        messagingSenderId: "1066085977551",
        appId: "1:1066085977551:web:174943ced9f771b1c9d6ba"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadApplications() {
        const container = document.getElementById('appsContainer');
        const loading = document.getElementById('loading');
        
        try {
            const querySnapshot = await getDocs(collection(db, "basvurular"));
            loading.style.display = 'none';
            container.innerHTML = "";

            if (querySnapshot.empty) {
                container.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>Henüz yapılmış bir başvuru yok.</p>";
                return;
            }

            querySnapshot.forEach((documentSnapshot) => {
                const data = documentSnapshot.data();
                const id = documentSnapshot.id;

                container.innerHTML += `
                    <div class="card" id="card-${id}">
                        <div class="date">${data.date || 'Tarih Yok'}</div>
                        <p><b>Discord:</b> ${data.discord || 'Girilmedi'}</p>
                        <p><b>Yaş:</b> ${data.age || 'Girilmedi'}</p>
                        <p><b>Aktiflik:</b> ${data.activity || '0'} Saat</p>
                        <p style="background:#252525; padding:8px; border-radius:4px;"><b>Açıklama:</b><br>${data.reason || 'Boş'}</p>
                        <button class="btn-delete" onclick="deleteApplication('${id}')">Sil</button>
                        <div style="clear:both;"></div>
                    </div>
                `;
            });
        } catch (error) {
            loading.innerHTML = "<span style='color:red;'>Hata: Veriler çekilemedi. Firebase Firestore Kurallarını (Rules) 'Test Modu' yaptığından emin ol!</span>";
            console.error(error);
        }
    }

    window.deleteApplication = async function(id) {
        if(confirm("Bu başvuruyu silmek istiyor musun?")) {
            await deleteDoc(doc(db, "basvurular", id));
            document.getElementById(`card-${id}`).remove();
        }
    }

    // Sayfa açılır açılmaz şifresiz yükle
    loadApplications();
</script>

</body>
</html>
